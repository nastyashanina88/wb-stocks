<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WB Stocks — Дашборд</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 24px; }

    .stats {
      display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .stat-card {
      background: #fff; border-radius: 8px; padding: 16px 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1); min-width: 160px;
    }
    .stat-card .label { font-size: 13px; color: #888; margin-bottom: 4px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card.critical .value { color: #e74c3c; }
    .stat-card.out .value { color: #95a5a6; }
    .stat-card.total .value { color: #2c3e50; }

    .controls { margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .controls input {
      padding: 10px 14px; width: 100%; max-width: 400px;
      border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
    }
    .controls select {
      padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 14px; background: #fff; min-width: 160px;
    }

    .table-wrap {
      background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
    th {
      background: #fafafa; font-weight: 600; cursor: pointer; user-select: none;
      position: sticky; top: 0;
    }
    th:hover { background: #f0f0f0; }
    th .arrow { margin-left: 4px; font-size: 11px; color: #aaa; }

    tr.out_of_stock { background: #fdecea; }
    tr.critical { background: #fff8e1; }
    tr.in_stock { background: #e8f5e9; }

    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 12px; font-weight: 600;
    }
    .status-badge.out_of_stock { background: #e74c3c; color: #fff; }
    .status-badge.critical { background: #f39c12; color: #fff; }
    .status-badge.in_stock { background: #27ae60; color: #fff; }

    .multi-select {
      position: relative; display: inline-block;
    }
    .multi-select .ms-btn {
      padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 14px; background: #fff; min-width: 180px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      white-space: nowrap;
    }
    .multi-select .ms-btn::after { content: "▾"; color: #888; }
    .multi-select .ms-dropdown {
      display: none; position: absolute; top: 100%; left: 0; z-index: 100;
      background: #fff; border: 1px solid #ddd; border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15); min-width: 220px; max-height: 300px;
      overflow-y: auto; margin-top: 4px;
    }
    .multi-select.open .ms-dropdown { display: block; }
    .multi-select .ms-search {
      width: 100%; padding: 8px 12px; border: none; border-bottom: 1px solid #eee;
      font-size: 13px; outline: none;
    }
    .multi-select .ms-item {
      display: flex; align-items: center; padding: 6px 12px; cursor: pointer;
      font-size: 13px;
    }
    .multi-select .ms-item:hover { background: #f5f5f5; }
    .multi-select .ms-item input { margin-right: 8px; }
    .multi-select .ms-item.hidden { display: none; }
    .multi-select .ms-actions {
      display: flex; justify-content: space-between; padding: 6px 12px;
      border-top: 1px solid #eee; font-size: 12px;
    }
    .multi-select .ms-actions a {
      color: #2980b9; cursor: pointer; text-decoration: none;
    }
    .multi-select .ms-actions a:hover { text-decoration: underline; }

    .days-zero { color: #95a5a6; font-weight: 600; }
    .days-danger { color: #e74c3c; font-weight: 700; }
    .days-warn { color: #f39c12; font-weight: 600; }

    .loading { text-align: center; padding: 60px; color: #888; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WB Stocks — Остатки</h1>

    <div class="stats">
      <div class="stat-card total"><div class="label">Всего позиций</div><div class="value" id="totalCount">—</div></div>
      <div class="stat-card critical"><div class="label">Критичных</div><div class="value" id="criticalCount">—</div></div>
      <div class="stat-card out"><div class="label">Нет в наличии</div><div class="value" id="outCount">—</div></div>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Поиск по артикулу, баркоду, бренду, складу...">
      <select id="filterWarehouse"><option value="">Все склады</option></select>
      <select id="filterBrand"><option value="">Все бренды</option></select>
      <select id="filterCategory"><option value="">Все категории</option></select>
      <div class="multi-select" id="msSubject">
        <div class="ms-btn" id="msSubjectBtn">Все товары</div>
        <div class="ms-dropdown">
          <input type="text" class="ms-search" placeholder="Поиск...">
          <div class="ms-actions"><a class="ms-all">Все</a><a class="ms-none">Сбросить</a></div>
          <div class="ms-list"></div>
        </div>
      </div>
      <select id="filterStatus">
        <option value="">Все статусы</option>
        <option value="in_stock">В наличии</option>
        <option value="critical">Критично</option>
        <option value="out_of_stock">Нет в наличии</option>
      </select>
    </div>

    <div class="table-wrap">
      <div class="loading" id="loading">Загрузка остатков...</div>
      <table id="stocksTable" style="display:none">
        <thead>
          <tr>
            <th data-col="warehouse">Склад <span class="arrow"></span></th>
            <th data-col="supplierArticle">Артикул <span class="arrow"></span></th>
            <th data-col="barcode">Баркод <span class="arrow"></span></th>
            <th data-col="quantity">Кол-во <span class="arrow"></span></th>
            <th data-col="brand">Бренд <span class="arrow"></span></th>
            <th data-col="category">Категория <span class="arrow"></span></th>
            <th data-col="subject">Предмет <span class="arrow"></span></th>
            <th data-col="price">Цена <span class="arrow"></span></th>
            <th data-col="daysUntilOOS">Дней до OOS <span class="arrow"></span></th>
            <th data-col="stockStatus">Статус <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let allRows = [];
    let sortCol = "quantity";
    let sortAsc = true;

    async function loadData() {
      try {
        const res = await fetch("/api/stocks");
        const { rows } = await res.json();
        allRows = rows;
        populateFilters();
        updateStats();
        renderTable();
        document.getElementById("loading").style.display = "none";
        document.getElementById("stocksTable").style.display = "";
      } catch (e) {
        document.getElementById("loading").textContent = "Ошибка загрузки данных";
      }
    }

    function updateStats() {
      const filtered = getFilteredRows();
      document.getElementById("totalCount").textContent = filtered.length;
      document.getElementById("criticalCount").textContent = filtered.filter(r => r.stockStatus === "critical").length;
      document.getElementById("outCount").textContent = filtered.filter(r => r.stockStatus === "out_of_stock").length;
    }

    function populateFilters() {
      const warehouses = [...new Set(allRows.map(r => r.warehouse))].sort();
      const brands = [...new Set(allRows.map(r => r.brand))].sort();
      const categories = [...new Set(allRows.map(r => r.category))].sort();
      const subjects = [...new Set(allRows.map(r => r.subject))].sort();
      const wSel = document.getElementById("filterWarehouse");
      const bSel = document.getElementById("filterBrand");
      const cSel = document.getElementById("filterCategory");
      warehouses.forEach(w => { const o = document.createElement("option"); o.value = w; o.textContent = w; wSel.appendChild(o); });
      brands.forEach(b => { const o = document.createElement("option"); o.value = b; o.textContent = b; bSel.appendChild(o); });
      categories.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; cSel.appendChild(o); });
      initMultiSelect("msSubject", subjects);
    }

    function getFilteredRows() {
      const q = document.getElementById("search").value.toLowerCase().trim();
      const fw = document.getElementById("filterWarehouse").value;
      const fb = document.getElementById("filterBrand").value;
      const fc = document.getElementById("filterCategory").value;
      const selectedSubjects = getMultiSelectValues("msSubject");
      const fs = document.getElementById("filterStatus").value;
      return allRows.filter(r => {
        if (fw && r.warehouse !== fw) return false;
        if (fb && r.brand !== fb) return false;
        if (fc && r.category !== fc) return false;
        if (selectedSubjects.length > 0 && !selectedSubjects.includes(r.subject)) return false;
        if (fs && r.stockStatus !== fs) return false;
        if (q && !(
          r.warehouse.toLowerCase().includes(q) ||
          r.supplierArticle.toLowerCase().includes(q) ||
          r.barcode.toLowerCase().includes(q) ||
          r.brand.toLowerCase().includes(q)
        )) return false;
        return true;
      });
    }

    function renderTable() {
      const rows = getFilteredRows().slice().sort((a, b) => {
        let va = a[sortCol], vb = b[sortCol];
        // null values go to the end
        if (va === null && vb === null) return 0;
        if (va === null) return 1;
        if (vb === null) return -1;
        if (typeof va === "number" && typeof vb === "number") {
          return sortAsc ? va - vb : vb - va;
        }
        va = String(va).toLowerCase();
        vb = String(vb).toLowerCase();
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
      });

      const tbody = document.getElementById("tbody");
      tbody.innerHTML = rows.map(r => `
        <tr class="${r.stockStatus}">
          <td>${esc(r.warehouse)}</td>
          <td>${esc(r.supplierArticle)}</td>
          <td>${esc(r.barcode)}</td>
          <td>${r.quantity}</td>
          <td>${esc(r.brand)}</td>
          <td>${esc(r.category)}</td>
          <td>${esc(r.subject)}</td>
          <td>${r.price}</td>
          <td class="${daysClass(r.daysUntilOOS)}">${r.daysUntilOOS === null ? '—' : r.daysUntilOOS}</td>
          <td><span class="status-badge ${r.stockStatus}">${statusLabel(r.stockStatus)}</span></td>
        </tr>
      `).join("");

      // Update sort arrows
      document.querySelectorAll("th .arrow").forEach(el => el.textContent = "");
      const activeHeader = document.querySelector(`th[data-col="${sortCol}"] .arrow`);
      if (activeHeader) activeHeader.textContent = sortAsc ? "▲" : "▼";
    }

    function daysClass(d) {
      if (d === null) return "";
      if (d === 0) return "days-zero";
      if (d <= 7) return "days-danger";
      if (d <= 14) return "days-warn";
      return "";
    }

    function statusLabel(s) {
      if (s === "out_of_stock") return "Нет";
      if (s === "critical") return "Критично";
      return "В наличии";
    }

    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    // Sort on header click
    document.querySelectorAll("th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (sortCol === col) {
          sortAsc = !sortAsc;
        } else {
          sortCol = col;
          sortAsc = true;
        }
        renderTable();
      });
    });

    // --- Multi-select ---
    function initMultiSelect(containerId, items) {
      const container = document.getElementById(containerId);
      const list = container.querySelector(".ms-list");
      const btn = container.querySelector(".ms-btn");
      const search = container.querySelector(".ms-search");

      items.forEach(item => {
        const label = document.createElement("label");
        label.className = "ms-item";
        label.innerHTML = `<input type="checkbox" value="${esc(item)}"> ${esc(item)}`;
        list.appendChild(label);
      });

      // Toggle dropdown
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        document.querySelectorAll(".multi-select.open").forEach(el => { if (el !== container) el.classList.remove("open"); });
        container.classList.toggle("open");
        if (container.classList.contains("open")) search.focus();
      });

      // Search within dropdown
      search.addEventListener("input", () => {
        const q = search.value.toLowerCase();
        list.querySelectorAll(".ms-item").forEach(item => {
          const text = item.textContent.toLowerCase();
          item.classList.toggle("hidden", !text.includes(q));
        });
      });
      search.addEventListener("click", e => e.stopPropagation());

      // Select all / none
      container.querySelector(".ms-all").addEventListener("click", (e) => {
        e.stopPropagation();
        list.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = true);
        updateMsLabel(containerId);
        updateStats(); renderTable();
      });
      container.querySelector(".ms-none").addEventListener("click", (e) => {
        e.stopPropagation();
        list.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
        updateMsLabel(containerId);
        updateStats(); renderTable();
      });

      // Checkbox change
      list.addEventListener("change", () => {
        updateMsLabel(containerId);
        updateStats(); renderTable();
      });
    }

    function getMultiSelectValues(containerId) {
      const checks = document.getElementById(containerId).querySelectorAll(".ms-list input:checked");
      return [...checks].map(c => c.value);
    }

    function updateMsLabel(containerId) {
      const container = document.getElementById(containerId);
      const btn = container.querySelector(".ms-btn");
      const vals = getMultiSelectValues(containerId);
      const total = container.querySelectorAll(".ms-list input").length;
      if (vals.length === 0 || vals.length === total) {
        btn.textContent = "Все товары";
      } else if (vals.length <= 2) {
        btn.textContent = vals.join(", ");
      } else {
        btn.textContent = `Выбрано: ${vals.length}`;
      }
    }

    // Close dropdown on outside click
    document.addEventListener("click", () => {
      document.querySelectorAll(".multi-select.open").forEach(el => el.classList.remove("open"));
    });

    // Search & filters
    ["search", "filterWarehouse", "filterBrand", "filterCategory", "filterStatus"].forEach(id => {
      document.getElementById(id).addEventListener(id === "search" ? "input" : "change", () => {
        updateStats();
        renderTable();
      });
    });

    loadData();
  </script>
</body>
</html>
